name: chonburi-minio-infra

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://localhost:9000}
      MINIO_REGION_NAME: ${MINIO_REGION:-ap-southeast-1}
      MINIO_UPDATE: "off"
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    networks:
      - minio-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-super-app-assets}
      MINIO_APP_USER: ${MINIO_APP_USER:-super-app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-ap-southeast-1}
      MINIO_POLICY_NAME: ${MINIO_POLICY_NAME:-super-app-bucket-rw}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-false}
    volumes:
      - ./scripts/init-minio.sh:/scripts/init-minio.sh:ro
    networks:
      - minio-net

networks:
  minio-net:
    driver: bridge

volumes:
  minio-data:
  minio-config:
